let index=0,answers=Array(questions.length).fill(null),lastResult=null;
const $=s=>document.querySelector(s);const views=[...document.querySelectorAll('.view')];
function show(id){views.forEach(v=>v.classList.toggle('active',v.id===id));window.scrollTo({top:0,behavior:'smooth'});}
function saveState(){localStorage.setItem('cityMatchState',JSON.stringify({index,answers}));}
function renderQuestion(){const q=questions[index];$('#qKicker').textContent=KICKERS[q.dim];$('#qText').textContent=q.text;$('#counter').textContent=String(index+1).padStart(2,'0')+' / '+questions.length;$('#progress').style.width=((index+1)/questions.length*100)+'%';$('#backBtn').disabled=index===0;$('#options').innerHTML=q.choices.map((o,i)=>`<button class="option ${answers[index]===i?'selected':''}" data-i="${i}"><span class="letter">${String.fromCharCode(65+i)}</span><span>${o.text}</span></button>`).join('');document.querySelectorAll('.option').forEach(b=>b.onclick=()=>selectAnswer(+b.dataset.i));}
function selectAnswer(i){answers[index]=i;saveState();document.querySelectorAll('.option').forEach((b,n)=>b.classList.toggle('selected',n===i));setTimeout(()=>{if(index<questions.length-1){index++;renderQuestion()}else finish()},170);}
function start(fresh=true){if(fresh){index=0;answers=Array(questions.length).fill(null);saveState()}show('quiz');renderQuestion();}
function finish(){const prefs={};Object.keys(DIMENSIONS).forEach(d=>{const vals=questions.map((q,i)=>q.dim===d&&answers[i]!=null?q.choices[answers[i]].value:null).filter(v=>v!=null);prefs[d]=Math.round(vals.reduce((a,b)=>a+b,0)/vals.length)});const weights={pace:1.15,career:1.2,cost:1.05,warmth:1.1,social:1,nature:1.05,culture:.95,order:.9};const ranked=cities.map(c=>{let diff=0,total=0;Object.keys(weights).forEach(d=>{diff+=Math.abs(prefs[d]-c.p[d])*weights[d];total+=weights[d]});const similarity=1-diff/(total*100);let score=Math.round(70+similarity*27);return{...c,score:Math.max(70,Math.min(97,score))}}).sort((a,b)=>b.score-a.score);lastResult={prefs,ranked};show('loading');setTimeout(()=>renderResult(),1550);localStorage.removeItem('cityMatchState');}
function renderResult(){const {prefs,ranked}=lastResult,c=ranked[0],cityIndex=cities.findIndex(x=>x.name===c.name),col=cityIndex%4,row=Math.floor(cityIndex/4);$('#resultLandmark').style.setProperty('--col',col);$('#resultLandmark').style.setProperty('--row',row);$('#cityName').textContent=c.name;$('#cityEn').textContent=c.en;$('#tagline').textContent='“'+c.tag+'”';$('#summary').textContent=c.summary;$('#persona').textContent='城市人格 · '+c.persona;$('#matchScore').textContent=c.score;$('#reasons').innerHTML=c.reasons.map((r,i)=>`<div class="reason"><b>0${i+1}</b>${r}</div>`).join('');$('#tradeoff').textContent=c.tradeoff;$('#bars').innerHTML=Object.entries(prefs).map(([d,v])=>`<div class="bar-row"><span>${DIMENSIONS[d]}</span><div class="bar-bg"><div class="bar-fill" style="width:${v}%"></div></div><b>${v}</b></div>`).join('');$('#top3').innerHTML=ranked.slice(1,3).map((x,i)=>`<div class="rank"><span>备选 0${i+2}</span><strong>${x.name} · ${x.score}%</strong><p>${x.tag}</p></div>`).join('');show('result');}
function shareText(){const c=lastResult.ranked[0],alts=lastResult.ranked.slice(1,3).map(x=>x.name).join('、');return `测完发现，最适合我定居的城市是${c.name}，契合度${c.score}%！\n${c.tag}\n另外两座备选城市是${alts}。你会测出哪里？`;}
function roundedRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();}
function wrap(ctx,text,x,y,maxWidth,lineHeight,maxLines=99){const chars=[...text];let line='',lines=[];for(const ch of chars){if(ctx.measureText(line+ch).width>maxWidth){lines.push(line);line=ch}else line+=ch}if(line)lines.push(line);lines.slice(0,maxLines).forEach((l,i)=>ctx.fillText(l,x,y+i*lineHeight));}
function downloadCard(){const c=lastResult.ranked[0],cv=$('#cardCanvas'),ctx=cv.getContext('2d');ctx.fillStyle='#f5f0e6';ctx.fillRect(0,0,1080,1440);ctx.fillStyle='#153b36';roundedRect(ctx,70,70,940,1120,44);ctx.strokeStyle='rgba(255,255,255,.16)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(890,190,230,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#efbd6a';ctx.font='700 24px sans-serif';ctx.fillText('CITY COMPASS · 城市罗盘',130,150);ctx.fillStyle='#fff';ctx.font='700 42px "Microsoft YaHei"';ctx.fillText('最适合我定居的城市',130,245);ctx.font='700 160px "STSong","Microsoft YaHei"';ctx.fillText(c.name,120,445);ctx.fillStyle='#efbd6a';ctx.font='28px sans-serif';ctx.fillText(c.en,130,505);ctx.fillStyle='#fff';ctx.font='300 112px sans-serif';ctx.fillText(c.score+'%',700,425);ctx.font='24px sans-serif';ctx.fillText('生活偏好契合度',720,470);ctx.font='700 36px "STSong","Microsoft YaHei"';wrap(ctx,c.tag,130,625,800,56,2);ctx.fillStyle='rgba(255,255,255,.8)';ctx.font='28px "Microsoft YaHei"';wrap(ctx,c.summary,130,755,800,50,5);ctx.fillStyle='#c94e38';roundedRect(ctx,70,1240,940,130,24);ctx.fillStyle='#fff';ctx.font='700 32px "Microsoft YaHei"';ctx.fillText('哪座城市最适合你定居？',125,1300);ctx.font='24px "Microsoft YaHei"';ctx.fillText('40 道生活选择 · 找到更像你的日子',125,1344);cv.toBlob(blob=>{if(!blob)return;const url=URL.createObjectURL(blob),a=document.createElement('a');a.download=`我的理想定居城市-${c.name}.png`;a.href=url;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)},'image/png');}
$('#startBtn').onclick=()=>start(true);$('#resumeBtn').onclick=()=>{const s=JSON.parse(localStorage.getItem('cityMatchState'));index=s.index;answers=s.answers;start(false)};$('#backBtn').onclick=()=>{if(index>0){index--;saveState();renderQuestion()}};$('#restartBtn').onclick=()=>{if(confirm('重新开始会清空本次结果，确定吗？'))start(true)};$('#saveCardBtn').onclick=downloadCard;$('#copyBtn').onclick=async()=>{await navigator.clipboard.writeText(shareText());$('#copyBtn').textContent='已复制';setTimeout(()=>$('#copyBtn').textContent='复制分享文案',1400)};
try{const s=JSON.parse(localStorage.getItem('cityMatchState'));if(s&&Array.isArray(s.answers)&&s.answers.some(x=>x!==null))$('#resumeBtn').hidden=false}catch(e){}
</script>
